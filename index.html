<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Form</title>
</head>
<body>
    <div class="container">
        <form action="#" autocomplete="false" method="post" name="google-sheet">
            <h2>Contact Me</h2>
            <p></p>
            <input type="text" placeholder="Name" name="Name" required>
            <input type="email" placeholder="Email" name="Email">
            <input type="text" placeholder="Mobile Number" name="Mobile" pattern="[1-9]{1}[0-9]{9}" title="Fill Correct Mobile Number" required>
            <select name="Gender" id="gender">
                <option value="Not Selected">Select Your Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
                <input type="text" placeholder="Address" name="Address" required>    

            </select>
            <textarea rows="5" placeholder="Write Your Query/Message" name="Message" required></textarea>
            <button type="submit" name="submit" id="submit" onclick="return check()">Send</button>
            
        </form>
    </div>
    <script>
        function check(){
        var g=document.getElementById("gender").value;
        if(g=="Not Selected"){
            alert("Kindly fill out all the required fields");
            return false;
        }}
        const scriptURL = 'https://script.google.com/macros/s/AKfycbynhXimpIkCOvRhE9eZucwRgC7X-1spaQxR-pWbVc19DM9YZGEWuGyA249lFxTPb-0/exec'
        const form = document.forms['google-sheet']
        var a=form.addEventListener('submit', e => {
            alert("wait for few seconds!")
          e.preventDefault()
          fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => alert("Thanks for Contacting Me!"))
            .catch(error => console.error('Error!', error.message))
            setTimeout(function(){
                location.reload()
            },6000)
            
        })
      </script>


</body>
</html>
